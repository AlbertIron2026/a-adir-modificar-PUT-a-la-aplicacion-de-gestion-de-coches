spring.application.name=cochesjpa1


# url: poner aqui el nombre de vuestra BD vacia de Workbench: "conspring1"
spring.datasource.url=jdbc:mysql://localhost:3306/conspring1

# username
spring.datasource.username=root

#password
spring.datasource.password=admin

#driver mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



#Configuración JPA/Hibernate:
#create-drop: crea las tablas y luego las borra
#después cambiarlo a = update
# en producción, dejarlo como = none
spring.jpa.hibernate.ddl-auto=update

#mostrar en consola las instrucciones sql:
spring.jpa.show-sql=true

# y aquí con espaciados, mejor formateado:
spring.jpa.properties.hibernate.format_sql=true

#qué sql exactamente: mySQL (si no pones esta linea en principio lo va a auto-detectar)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect